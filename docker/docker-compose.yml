# Cerebro Hub — despliegue de la capa de aplicación en Docker.
#
#   · hub   → backend + panel  (127.0.0.1:4597)
#
# El puente MCP y el servidor OpenCode V1 siguen en el host (trabajan sobre tus
# carpetas): el hub los alcanza por host.docker.internal.
#
# Uso:  docker compose -f docker/docker-compose.yml up -d --build
name: cerebro-hub

services:
  hub:
    build:
      # En el repositorio: ../config/hub · En la instalación: ../hub (lo ajusta el instalador)
      context: ../config/hub
    image: cerebro-hub:latest
    container_name: cerebro-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:4597:4597"
    environment:
      - SISTEMA_CEREBRO_DIR=/sistema
      - HUB_DATA_DIR=/sistema/hub-data
      - HUB_HOST=0.0.0.0
      - OPENCODE_DIR=/opencode
      - CLAUDE_DIR=/claude
      - OPENCODE_AUTH=/opencode-auth/auth.json
      - OPENCODE_HOST=host.docker.internal
      # El instalador sustituye esta línea por la carpeta de trabajos del MCP
      # (o la monta el usuario a mano si usa el compose del repo directamente).
      # __TAREAS_MCP_ENV__
    volumes:
      - ${USERPROFILE}/.sistema-cerebro-agentes:/sistema
      - ${USERPROFILE}/.config/opencode:/opencode:ro
      - ${USERPROFILE}/.claude:/claude:ro
      - ${USERPROFILE}/.local/share/opencode:/opencode-auth:ro
      # __TAREAS_MCP_VOL__
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cerebro]

networks:
  cerebro: {}
